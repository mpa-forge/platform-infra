name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    uses: mpa-forge/.github/.github/workflows/reusable-ci-infra.yml@main
    with:
      working-directory: "."
      terraform-version: "1.14.5"
      format-command: "make repo-format-check"
      lint-command: "make repo-lint"
      validate-command: "make terraform-validate"
      policy-command: "make repo-policy-check"
