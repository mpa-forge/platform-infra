# Placeholder collector configuration for the future GKE `collector_gateway`
# path. Keep this file illustrative until Phase 5/6 adds deployable GKE roots
# and chart/module ownership in this repository.
extensions:
  basicauth/grafana:
    client_auth:
      username: ${env:GRAFANA_CLOUD_INSTANCE_ID}
      password: ${env:GRAFANA_OTLP_INGEST_TOKEN}

receivers:
  otlp:
    protocols:
      grpc:
      http:

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  batch:
    timeout: 5s
    send_batch_size: 512
  tail_sampling:
    decision_wait: 5s
    num_traces: 5000
    expected_new_traces_per_sec: 50
    policies:
      - name: trace-errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: trace-latency
        type: latency
        latency:
          threshold_ms: 1000
      - name: explicit-force-sample
        type: string_attribute
        string_attribute:
          key: platform.observability.force_sample.reason
          values: [manual, http_error, high_latency]
      - name: baseline-ratio
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:TRACE_SAMPLE_PERCENT}

exporters:
  otlphttp/grafana:
    endpoint: https://otlp-gateway-prod-us-east-3.grafana.net/otlp
    auth:
      authenticator: basicauth/grafana

service:
  extensions: [basicauth/grafana]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlphttp/grafana]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/grafana]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/grafana]
