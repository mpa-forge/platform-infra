# Placeholder manifest for the future GKE path.
# Replace the SecretStore reference and namespace values when Phase 5/6 adds
# deployable cluster modules.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-api-grafana-otlp-ingest-token
  namespace: platform-blueprint
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    name: backend-api-grafana-otlp
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GRAFANA_OTLP_INGEST_TOKEN: '{{ .grafana_otlp_ingest_token }}'
  data:
    - secretKey: grafana_otlp_ingest_token
      remoteRef:
        key: grafana-otlp-ingest-token-rc
